name: "Test"
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evaluate:
    name: Evaluate flake configurations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: horus
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Evaluate flake checks
        run: nix flake check --keep-going
      - name: Evaluate NixOS configurations
        run: |
          for host in mars mercury; do
            nix eval --raw --show-trace \
              ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"
          done
      - name: Evaluate Home Manager configurations
        run: |
          for host in yokley@venus yokley@almagest yokley@jupiter yokley@singularity; do
            nix eval --raw --show-trace \
              ".#homeConfigurations.\"${host}\".activationPackage.drvPath"
          done
  build-linux:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NixOS mars
            attribute: '.#nixosConfigurations.mars.config.system.build.toplevel'
          - name: NixOS mercury
            attribute: '.#nixosConfigurations.mercury.config.system.build.toplevel'
          - name: Home Manager mars
            attribute: '.#homeConfigurations.default.activationPackage'
          - name: Home Manager venus
            attribute: '.#homeConfigurations."yokley@venus".activationPackage'
          - name: Home Manager almagest
            attribute: '.#homeConfigurations."yokley@almagest".activationPackage'
          - name: Home Manager jupiter
            attribute: '.#homeConfigurations."yokley@jupiter".activationPackage'
          - name: Home Manager singularity
            attribute: '.#homeConfigurations."yokley@singularity".activationPackage'
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: horus
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build configuration
        run: nix build --no-link --print-build-logs '${{ matrix.attribute }}'
  build-darwin:
    name: Build Darwin dioxygen
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: horus
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build configuration
        run: nix build --no-link --print-build-logs '.#darwinConfigurations.dioxygen.system'
