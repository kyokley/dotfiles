name: "Test"
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evaluate:
    name: Evaluate flake configurations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate flake checks
        run: nix flake check --no-build --keep-going
      - name: Evaluate NixOS configurations
        run: |
          for host in mars mercury; do
            nix eval --raw --show-trace \
              ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"
          done
      - name: Evaluate Home Manager configurations
        run: |
          for host in yokley@venus yokley@almagest yokley@jupiter yokley@singularity; do
            nix eval --raw --show-trace \
              ".#homeConfigurations.\"${host}\".activationPackage.drvPath"
          done
